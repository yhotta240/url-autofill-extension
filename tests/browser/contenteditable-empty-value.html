<!doctype html>
<html lang="ja">
  <meta charset="utf-8">
  <title>contenteditableの空値テスト</title>
  <h1>contenteditableの空値テスト</h1>
  <p>Viteで開き，ボタンを押すと実ブラウザーの編集処理で削除と取り消しを検証します．</p>
  <div id="editor" contenteditable="true"><b>削除対象</b><div>2行目</div></div>
  <div id="empty-host" contenteditable="true">前<span id="empty"></span>後</div>
  <p id="outside">対象外の内容</p>
  <button id="run" type="button">空値の回帰テストを実行</button>
  <pre id="result" aria-live="polite">未実行</pre>
  <script type="module">
    import { executeFill } from "../../src/content/autofill.ts";

    const editor = document.querySelector("#editor");
    const outside = document.querySelector("#outside");
    const run = document.querySelector("#run");
    const output = document.querySelector("#result");
    run.addEventListener("click", async () => {
      run.disabled = true;
      const before = editor.innerText;
      const outsideBefore = outside.innerHTML;
      let nativeInput = false;
      const onInput = (event) => { nativeInput ||= event.isTrusted; };
      editor.addEventListener("input", onInput);
      try {
        // Popup側で準備済みの経路を使い，OSのクリップボードには触れない．
        const result = await executeFill(editor, "", undefined, { clipboardPrepared: true });
        const cleared = editor.textContent === "";
        const nativeDelete = nativeInput;
        document.execCommand("undo");
        const undoRestored = editor.innerText === before;
        const emptyHost = document.querySelector("#empty-host");
        const emptyBefore = emptyHost.innerHTML;
        await executeFill(document.querySelector("#empty"), "", undefined, { clipboardPrepared: true });
        const checks = {
          cleared,
          nativeDelete,
          outsidePreserved: outside.innerHTML === outsideBefore,
          undoRestored,
          emptyTargetPreserved: emptyHost.innerHTML === emptyBefore,
        };
        const passed = result === "command-dispatched" && Object.values(checks).every(Boolean);
        output.textContent = `${passed ? "PASS" : "FAIL"}\n${JSON.stringify(checks, null, 2)}`;
      } catch (error) {
        output.textContent = `FAIL: ${error.message}`;
      } finally {
        editor.removeEventListener("input", onInput);
        run.disabled = false;
      }
    });
  </script>
</html>
